<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eckert Finance</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e3b27">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('fin.theme')||'null');}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg></div>
      <div class="logo-word">eckert<span>.fin</span></div>
    </div>
    <div class="nav-label">Analyze</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="sync"><span class="dot"></span>Loading…</div>
      <div class="theme-toggle" id="themeToggle"><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pageTitle">Overview</h1><p id="pageSub"></p></div>
      <div class="top-actions">
        <button class="btn mob-only" id="themeMob" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
        <button class="btn fbtn" id="filterBtn"></button>
        <button class="btn" id="layoutBtn" title="Hide or rearrange cards on this page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M10 9v12"/></svg><span>Layout</span></button>
        <button class="btn primary" id="importBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Import</span></button>
        <div class="avatar">·</div>
      </div>
    </header>
    <section class="page" id="p-overview"></section>
    <section class="page" id="p-budget"></section>
    <section class="page" id="p-invest"></section>
    <section class="page" id="p-plan"></section>
    <section class="page" id="p-tx"></section>
    <section class="page" id="p-balances"></section>
    <section class="page" id="p-builder"></section>
    <section class="page" id="p-cats"></section>
    <section class="page" id="p-loans"></section>
    <section class="page" id="p-assets"></section>
    <section class="page" id="p-taxes"></section>
    <section class="page" id="p-admin"></section>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div class="tip" id="tip"></div>
<div class="flt-pop" id="fltPop"></div>
<div class="boot busy" id="boot"><div class="boot-card"><div class="logo">
      <div class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg></div>
      <div class="logo-word">eckert<span>.fin</span></div>
    </div><div class="boot-body"><div class="spin"></div><p class="muted">Loading…</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
</body>
</html>
